name: Record demo GIF

# Records demo/demo.gif from demo/demo.tape, so it doesn't have to be made on
# your own machine. Run it from the Actions tab ("Run workflow"), or with:
#   gh workflow run demo-gif.yml
# The GIF is attached to the run as "demo-gif". Download it into demo/,
# check it, and commit it yourself: this workflow never changes the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record the GIF
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit hashes, not tags: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs VHS with ttyd and ffmpeg, then runs the tape from the repository root.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: demo/demo.tape
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: demo/demo.gif
          if-no-files-found: error
