name: Tests and demo

# Runs the linter and the test suite, then the demo, on every push and pull
# request. The demo's report appears on the run's summary page, so anyone can
# see real, current output without installing anything.

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit hashes, not tags: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint with shellcheck
        run: shellcheck -S warning node-security-check.sh tests/run-tests.sh demo/*.sh
      - name: Run the tests
        run: bash tests/run-tests.sh

  demo-app:
    name: Demo (app)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the fake demo app
        run: bash demo/make-demo-app.sh "$RUNNER_TEMP/demo-shop"
      - name: Check it
        run: |
          set +e
          bash node-security-check.sh --yes --skip server --history \
            --markdown "$RUNNER_TEMP/demo-app-report.md" \
            --html "$RUNNER_TEMP/demo-app-report.html" \
            "$RUNNER_TEMP/demo-shop"
          code=$?
          set -e
          cat "$RUNNER_TEMP/demo-app-report.md" >> "$GITHUB_STEP_SUMMARY"
          # The demo app is built to fail with a compromise alert (exit code 1).
          # Any other result means the script or the demo is broken.
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 from the demo app, got $code" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-app-report
          path: ${{ runner.temp }}/demo-app-report.html
          if-no-files-found: error

  demo-server:
    name: Demo (server in a container)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the demo server and run the check inside it
        run: bash demo/run-demo.sh --markdown /tmp/demo-report.md
      - name: Show the result
        run: |
          docker compose -f demo/docker-compose.yml cp demo:/tmp/demo-report.md "$RUNNER_TEMP/demo-server-report.md"
          cat "$RUNNER_TEMP/demo-server-report.md" >> "$GITHUB_STEP_SUMMARY"
          # The demo server must be reported as compromised, with its weak settings found.
          grep -q 'COMPROMISE' "$RUNNER_TEMP/demo-server-report.md"
          grep -q 'SRV-UID0' "$RUNNER_TEMP/demo-server-report.md"
          grep -q 'SITE-ENV-PUBLIC' "$RUNNER_TEMP/demo-server-report.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-server-report
          path: demo/demo-report.html
          if-no-files-found: error
      - name: Stop the demo server
        if: always()
        run: bash demo/run-demo.sh --stop
